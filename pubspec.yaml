name: plantamed
description: Plateforme mobile intelligente de détection des plantes médicinales
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0

  # Caméra & Images
  camera: ^0.12.0+1
  image_picker: ^1.0.7

  # Réseau & API (Pl@ntNet)
  http: ^1.2.0
  http_parser: ^4.0.2

  # Gestion d'état
  provider: ^6.1.1

  # Navigation
  go_router: ^17.2.0

  # UI
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^8.0.2

  # Base de données locale
  sqflite: ^2.3.0
  path: ^1.9.0

  # Stockage local
  shared_preferences: ^2.2.2

  # Permissions
  permission_handler: ^12.0.1

  # Utilitaires
  logger: ^2.2.0
  connectivity_plus: ^7.1.1
  tflite_flutter: ^0.12.1
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/plant_labels2.tflite
    - assets/models/plant_labels2.json
    - assets/models/plant_labels.json
    - assets/models/plant_labels.tflite
    - assets/models/plant_labels_40classes.json
    - assets/models/plant_model_40classes.tflite
    - assets/data/
    - assets/images/
    - assets/icons/